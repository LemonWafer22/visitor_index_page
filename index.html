<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mkr | logik.bio</title>
    <style>
        :root {
            --bg-color: #161616;
            --text-color: #d4c8b8;
            --accent-color: #4a5d4e; /* Subtle forest green */
            --meta-color: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            line-height: 1.6;
        }

        h1 {
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-size: 2rem;
            font-family: monospace; /* Gives the monogram a technical edge */
        }

        h2 {
            font-weight: normal;
            font-style: italic;
            color: var(--meta-color);
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 30px;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-color);
            padding-bottom: 2px;
            transition: opacity 0.3s ease;
            font-family: monospace;
            font-size: 1.1rem;
        }

        a:hover {
            opacity: 0.7;
        }

        .counter-container {
            margin-top: 60px;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--meta-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Filters the default bright green badge to match the dark theme */
        .counter-badge {
            filter: grayscale(100%) opacity(0.7); 
        }
    </style>
</head>
<body>

    <h1>mkr</h1>
    <h2>B.Sc. Computer Science & Medical Informatics</h2>

    <div>
        <a href="mailto:mkr@logik.bio">mkr@logik.bio</a>
    </div>

    <!-- Serverless Visitor Counter -->
    <div class="counter-container">
        <span>access_count:</span>
        <img class="counter-badge" src="https://profile-counter.glitch.me/logikbio_mkr/count.svg" alt="Visitor Count" />
    </div>

</body>
</html>
